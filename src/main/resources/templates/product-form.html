<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form</title>
    <link rel="stylesheet" th:href="@{/css/product-form.css}" />
</head>

<body>
    <div class="card">
        <!-- Dynamic title: Add or Edit -->
        <h1 th:text="${product.id != null} ? 'Edit Product' : 'Add New Product'">Product
            Form</h1>
        <!-- th:object binds the whole form to the product object -->
        <!-- th:field binds each input to a product property -->
        <form th:action="@{/products/save}" th:object="${product}" method="post">
            <!-- Hidden id field: when editing, ensures the correct record is updated -->
            <input type="hidden" th:field="*{id}" />
            <div class="form-group">
                <label for="productCode">Product Code</label>
                <!-- th:field sets id, name, and value in one attribute -->
                <input type="text" id="productCode" th:field="*{productCode}" placeholder="e.g. P006" required />
            </div>
            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Enter product name" required />
            </div>
            <div class="form-group">
                <label for="price">Price (USD)</label>
                <input type="number" id="price" th:field="*{price}" step="0.01" min="0" required />
            </div>
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" th:field="*{quantity}" min="0" required />
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" th:field="*{category}">
                    <option value="">-- Select Category --</option>
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Category</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" placeholder="Optional description"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Product</button>
                <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>

</html>
